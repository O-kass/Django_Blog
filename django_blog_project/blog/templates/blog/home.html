{% extends "blog/base.html" %}

{% block content %}
<h1> Blog Home </h1>
    {% for post in posts%}
    <article class="media content-section">
          <div class="media-body">
            <div class="article-metadata">
              <a class="mr-2" >By {{ post.author }}</a>
              <small class="text-muted">{{ post.date_posted|date:"d-N-Y  P" }}</small>
            </div>
              <h2><a class="article-title" > <strong>{{ post.title }}</strong> </a></h2>
            <p class="article-content">{{ post.content }}</p>
          </div>
        </article>
    {% endfor %}
{% endblock content %}
